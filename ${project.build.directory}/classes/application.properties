spring.application.name=balance-challenge

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/balance}
spring.datasource.username=${DB_USERNAME:balance}
spring.datasource.password=${DB_PASSWORD:balance}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=${SQL_LOG_LEVEL:DEBUG}
logging.level.org.hibernate.orm.jdbc.bind=${SQL_BIND_LOG_LEVEL:TRACE}

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

springdoc.swagger-ui.path=/swagger-ui.html
